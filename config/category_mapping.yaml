# Manual category alias/override configuration (WP-006 activates this file).
#
# Canonical categories originate from the historical workbook's `category`
# column (WP-003) and must NOT be guessed or duplicated here.
#
# Each entry maps one alternative/observed wording (e.g. from a student-
# summary chapter heading) onto an already-canonical category name. An alias
# key must never equal an existing canonical category name, and every target
# must itself be a real canonical category - both are validated when the
# category resolver is constructed.
#
# Example (illustrative only - not a real/approved mapping):
# mapping:
#   "עצבי גולגולת": "עצבים קרניאליים"

mapping: {}
