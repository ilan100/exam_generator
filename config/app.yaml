# Application-level configuration.
# Paths are project-relative; do not hard-code machine-specific absolute paths.

paths:
  data_dir: data
  output_dir: output
  index_dir: index
  prompts_dir: prompts
  schemas_dir: schemas

# Generation/production behavior. max_generation_attempts (WP-013) and
# max_duplicate_replacement_attempts (WP-014) are active. The three
# diversity_* fields remain architecturally defined placeholders, not yet
# used by any implemented behavior (semantic/embedding diversity scoring is
# out of scope through at least WP-014 - see docs/ARCHITECTURE.md).
generation:
  initial_diversity_target: 0.7
  minimum_diversity_target: 0.3
  diversity_relaxation_step: 0.1
  max_generation_attempts: 3
  # WP-014: bounded exam-level duplicate-replacement attempts - distinct from
  # max_generation_attempts (WP-013's per-question quality-regeneration bound).
  max_duplicate_replacement_attempts: 2

# Deterministic character-based chunking (WP-005). Values are measured in
# Python Unicode characters, not model tokens.
chunking:
  chunk_size: 1800
  chunk_overlap: 300

# Local lexical (TF-IDF) retrieval (WP-006). The analyzer (character
# n-grams) is a fixed internal policy, not configuration - see
# docs/ARCHITECTURE.md.
retrieval:
  top_k: 8
  ngram_min: 3
  ngram_max: 5
