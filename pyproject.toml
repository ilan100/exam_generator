[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-generator"
version = "0.1.0"
description = "Generates Hebrew neuroanatomy multiple-choice exams from supplied course material."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "scikit-learn>=1.4",
    "openai>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
exam-generator = "exam_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
